name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Frontend: TypeScript type-check + ESLint
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — tsc + ESLint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  # ──────────────────────────────────────────────────────────────────────────
  # Backend: flake8 lint + pytest
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — flake8 + pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: flake8 lint
        run: flake8 .

      - name: pytest
        # DATABASE_URL is not needed for the placeholder test.
        # Real integration tests will require a service container — added in Phase 1.
        env:
          DATABASE_URL: "postgresql://wasl:wasl@localhost:5432/wasl_test"
          JWT_SECRET_KEY: "ci-only-not-a-real-secret"
          ENCRYPTION_KEY: "ci-only-not-a-real-secret-key-x"
        run: pytest --tb=short -q
