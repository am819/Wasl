[flake8]
# Maximum line length — 88 matches Black's default
max-line-length = 88

# Directories and files to skip
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    migrations,
    *.egg-info,
    dist,
    build

# Error codes to ignore:
# E203 — whitespace before ':' (conflicts with Black)
# W503 — line break before binary operator (conflicts with PEP8 E)
# E501 is handled by max-line-length above
extend-ignore = E203, W503
